{% extends "base.html" %}

{% block content %}
  <h2>Drivers</h2>
  <table>
    <tr><th>Username</th><th>Full Name</th></tr>
    {% for driver in object_list %}
      <tr>
        <td><a href="{% url 'driver-detail' driver.id %}">{{ driver.username }}</a></td>
        <td>{{ driver.first_name }} {{ driver.last_name }}</td>
      </tr>
    {% endfor %}
  </table>
  {% include "includes/pagination.html" %}
{% endblock %}
